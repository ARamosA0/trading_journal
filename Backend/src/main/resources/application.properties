spring.application.name=portfolio

app.jwt.secret=${JWT_SECRET}
app.auth.cookie-secure=${AUTH_COOKIE_SECURE:false}
app.auth.google.client-id=${GOOGLE_CLIENT_ID:}
app.auth.email.enabled=${AUTH_EMAIL_ENABLED:false}
app.auth.password-reset-url=${PASSWORD_RESET_URL:http://localhost:3000/reset-password}
app.auth.email.from=${SMTP_FROM:no-reply@tradevault.example}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/app_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:true}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true
